name: Release from develop

# Merging a pull request from develop into master builds a signed release APK
# and publishes it as a GitHub release tagged v<versionName>.
#
# The version comes from presentation/build.gradle. If that version already has
# a release, the patch number and versionCode are bumped and the bump is
# committed to master. Afterwards develop is fast-forwarded to master so the
# two branches start the next cycle in sync.
#
# Needs these repository secrets: ANDROID_KEYSTORE_BASE64 (the keystore file,
# base64-encoded), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD.

on:
  pull_request:
    types:
      - closed
    branches:
      - master

concurrency:
  group: release-from-develop
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_FILE: presentation/build.gradle
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Set up signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing secret::Repository secret $name is not set."
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]]

          # presentation/build.gradle signs release builds with this file, and on CI
          # reads the passwords from these environment variables
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > presentation/my-release-key.keystore
          chmod 600 presentation/my-release-key.keystore
          {
            echo "keystore_password=$ANDROID_KEYSTORE_PASSWORD"
            echo "key_alias=$ANDROID_KEY_ALIAS"
            echo "key_password=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Pick the release version
        id: version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          gradle = pathlib.Path(os.environ["GRADLE_FILE"])
          text = gradle.read_text()
          code_re = re.compile(r"(^\s*versionCode\s+)(\d+)", re.MULTILINE)
          name_re = re.compile(r"(^\s*versionName\s+['\"])(\d+)\.(\d+)\.(\d+)(['\"])", re.MULTILINE)
          code_match, name_match = code_re.search(text), name_re.search(text)
          if not code_match or not name_match:
              raise SystemExit(f"Couldn't read versionCode and versionName (x.y.z) from {gradle}")

          code = int(code_match.group(2))
          major, minor, patch = (int(name_match.group(i)) for i in (2, 3, 4))
          tags = set(subprocess.run(["git", "tag", "--list", "v*"], check=True,
                                    capture_output=True, text=True).stdout.split())

          bumped = f"v{major}.{minor}.{patch}" in tags
          if bumped:
              while f"v{major}.{minor}.{patch}" in tags:
                  patch += 1
              code += 1
              text = code_re.sub(lambda m: f"{m.group(1)}{code}", text, count=1)
              text = name_re.sub(lambda m: f"{m.group(1)}{major}.{minor}.{patch}{m.group(5)}", text, count=1)
              gradle.write_text(text)

          name = f"{major}.{minor}.{patch}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"name={name}\ncode={code}\ntag=v{name}\nbumped={str(bumped).lower()}\n")
          print(f"Releasing v{name} ({code})" + (" after bumping the version" if bumped else ""))
          PY

      - name: Commit the version bump
        if: steps.version.outputs.bumped == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: release $TAG ($CODE)" -- "$GRADLE_FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build signed release APK
        run: ./gradlew :presentation:assembleRelease

      - name: Collect the APK
        id: apk
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(presentation/build/outputs/apk/release/QUIK-v*-release.apk)
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "::error title=APK not found::Expected 1 release APK, found ${#files[@]}."
            exit 1
          fi
          (cd "$(dirname "${files[0]}")" && sha256sum "$(basename "${files[0]}")") > checksums.txt
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          set -euo pipefail
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "$PR_BASE_SHA..HEAD" | grep -v '^- chore: release v' || true
            echo
            echo "Merged in #$PR_NUMBER."
          } > release-notes.md
          cat release-notes.md

      - name: Push the version bump
        if: steps.version.outputs.bumped == 'true'
        run: git push origin HEAD:master

      - name: Publish the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          gh release create "$TAG" "$APK" checksums.txt \
            --target "$(git rev-parse HEAD)" \
            --title "QUIK $TAG" \
            --notes-file release-notes.md

      - name: Fast-forward develop to master
        run: |
          set -euo pipefail
          git fetch origin develop
          if git merge-base --is-ancestor origin/develop HEAD; then
            git push origin HEAD:develop
          else
            echo "::warning title=develop not updated::develop has commits that master doesn't; merge master into develop to pick up the release."
          fi

      - name: Remove signing key
        if: always()
        run: rm -f presentation/my-release-key.keystore
